experiment_id: C5.0e_postproc_rules
date: 2026-09-23
purpose: "后处理上界诊断：零重训的两条相对参数规则，量化'后处理还能吃掉多少'"
seed: 20260915
params:
  rule_A_resplit:
    what: "体积 > k × 同帧实例体积中位数 的实例，用 0.5×h_frac 再切一次（单参数 k，相对量）"
    impl: "detect/instances.py::refine_oversized_instances + predict_to_h5 --resplit-k"
    variant: {k: 1.6}
  rule_B_drop_isolated:
    what: "删除长度 ≤ L 帧且既无父也无子的孤立轨迹（单参数 L，帧数）"
    impl: "track/base.py::drop_isolated_short_tracks + reconstruct.drop_isolated_len"
    variants: {L: [1, 2]}
  anti_overfit:
    - "两个参数都是相对量（中位数倍数 / 帧数），不含任何绝对体素常数"
    - "seq01 定参数、seq02 验证（seq02 真实检测档尚未生成，留待后续）"
    - "全部标注为论文之外的工程补充，主链路默认配置不变"
