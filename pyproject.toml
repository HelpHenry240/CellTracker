[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celltracker"
version = "0.1.0"
description = "基于时序网络 + 最优传输的显微细胞追踪（CTC 3D 为主）"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "paperpipe/src"]
testpaths = ["tests", "paperpipe/tests"]
addopts = "-q"
