# Fluo-N3DH-CE 的同来源预测实例配置，标定日期 2026-10-09。
# 适用来源：h_frac=0.1、min_volume=300、无平滑、分水岭、再切分 k=1.6。
# 原始前景复用已有 nnU-Net 分割；encoder 是同一冻结模型的 stage-2 128维特征。
# 保留 FGW、运动、多尺度、GNN 和 tracklet；孤立实例保留由官方双序列对照决定。
# 配套 GNN 必须来自 conservative_k16；模型会检查前端和上游契约。
# 新数据/新分割来源必须重新标定并独立训练，不能直接套用这些绝对质量阈值。
# seq02 仅替换 node.encoder_feat_path，沿用 seq01 标定参数和 GNN 权重。
measure:
  mass_mode: volume
  knn_k: 6
  sigma_x: null
  sigma_f: null
  spacing_zyx: null
  structure_mode: full
coupling:
  enabled: true
  alpha: 1.0
  alpha_pred: 0.0
  beta: 1.0
  sigma_s: null
  r_max: 6.4
  eta: 0.3
  eps_rel: 1.0
  eps: null
  tau_a: 1.0
  tau_b: 1.0
  sinkhorn_iters: 1000
  fgw_outer: 10
motion:
  enabled: true
  alpha_pred: 1.0
multiscale:
  enabled: true
  ks:
  - 2
  - 3
  - 5
  lambda_temp:
    2: 0.1
    3: 0.05
    5: 0.02
  n_rounds: 2
  norm: raw
  line_search: true
  jump_r_max_scale: 1.0
tracklet:
  enabled: true
  window: 5
  theta_link: 0.5
  local_confidence: 0.8
  tau: 0.5
  max_gap: 3
  velocity_weight: 1.0
  size_weight: 1.0
  merge_division_children: false
  hole_policy: fill
graph:
  theta_gamma_frac: null
  theta_gamma: 3.4001383785074326e-05
  theta_c: 57.72828135403646
  cand_topk: 0
  ctx_window: 2
  bridge: true
  bridge_gap: 2
  bridge_scope: missing_only
  intra_knn: 4
  intra_enabled: true
  context_enabled: true
  use_ot_candidates: true
  use_ot_features: true
  use_intra_similarity: true
reconstruct:
  theta_gamma_frac: null
  theta_gamma: 3.4001383785074326e-05
  theta_c: 57.72828135403646
  eta_death: 0.04082251358678885
  eta_birth: 0.02579907763872847
  mass_threshold_mode: absolute
  birth_death_enabled: true
  death_veto: true
  birth_veto: true
  division_enabled: true
  volume_conservation: true
  div_ratio: 0.05
  vol_tol: 0.5
  max_children: 2
  tau_edge: 0.5
  hole_policy: fill
  filter_isolated: false
  mark_uncertainty: true
node:
  f_source: encoder_npz
  encoder_feat_path: data/interim/encoder_01_resplit_v2.npz
gnn:
  enabled: true
  hidden: 64
  layers: 3
  dropout: 0.1
  lambda_ot: 0.001
  class_weighted_ce: false
  residual: false
seed: 20261008
detection_source: nnunet_pred
schema_version: ideas-v3
